<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotchLyrics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="notch-wrapper" id="notchWrapper">
    <!-- SVG Ears for pixel-perfect Apple notch concave curves -->
    <svg class="notch-ear left" width="12" height="12" viewBox="0 0 12 12" fill="none">
      <path d="M0 0C6.62742 0 12 5.37258 12 12V0H0Z" fill="#000000"/>
    </svg>

    <!-- Main Black Hardware Notch Body -->
    <div class="notch-body" id="notchBody">
      <!-- Compact View (Image 2 style) -->
      <div class="compact-content" id="compactContent">
        <!-- Left: Clean mini Album Art / Icon -->
        <div class="album-thumb-wrapper">
          <img class="album-thumb hidden" id="albumThumb" src="" alt="" />
          <div class="album-placeholder" id="albumPlaceholder">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
              <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
          </div>
        </div>

        <!-- Center: Clean Single-line Lyric Ticker -->
        <div class="lyric-area">
          <div class="lyric-text" id="activeLyric">Menghubungkan musik...</div>
        </div>

        <!-- Right: Minimal 3-dots indicator -->
        <div class="right-indicator" id="expandToggle" title="Detail">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>

      <!-- Expanded Apple-style Media Card (Smoothly expands downward on hover/click) -->
      <div class="expanded-content" id="expandedContent">
        <div class="media-row">
          <img class="exp-art" id="expAlbumArt" src="" alt="" />
          <div class="exp-info">
            <div class="exp-title" id="trackTitle">Tidak Ada Lagu</div>
            <div class="exp-artist" id="trackArtist">Putar lagu di Spotify atau YouTube</div>
          </div>
          <div class="exp-controls">
            <button class="icon-btn" id="prevBtn" title="Previous">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="icon-btn play" id="playPauseBtn" title="Play/Pause">
              <svg id="playIcon" viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="icon-btn" id="nextBtn" title="Next">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
          </div>
        </div>

        <!-- Sleek Scrubber Bar -->
        <div class="scrubber-bar-wrapper">
          <div class="scrubber-track">
            <div class="scrubber-fill" id="progressFill"></div>
          </div>
          <div class="scrubber-times">
            <span id="currentTime">0:00</span>
            <span id="totalDuration">0:00</span>
          </div>
        </div>

        <!-- Next Lyric & Sync Micro-adjust -->
        <div class="card-footer">
          <div class="next-preview">
            <span class="next-prefix">Next</span>
            <span class="next-line" id="nextLyric">...</span>
          </div>
          <div class="sync-tools">
            <button class="offset-btn" id="offsetMinus">-0.5s</button>
            <span class="offset-label" id="offsetDisplay">0.0s</span>
            <button class="offset-btn" id="offsetPlus">+0.5s</button>
            <button class="ghost-toggle" id="ghostModeBtn" title="Ghost Mode">👻</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Ear -->
    <svg class="notch-ear right" width="12" height="12" viewBox="0 0 12 12" fill="none">
      <path d="M12 0C5.37258 0 0 5.37258 0 12V0H12Z" fill="#000000"/>
    </svg>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
